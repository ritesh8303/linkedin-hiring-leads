<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Data & AI Jobs — Remote + EU</title>
  <meta name="description" content="Data Science, ML, and AI jobs — remote worldwide and hybrid/on-site in the EU." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <header class="top">
    <div class="brand">
      <span class="mark">AI</span>
      <div>
        <p class="brand-name">Data &amp; AI Jobs</p>
        <p class="brand-sub">Remote worldwide · EU hybrid &amp; on-site</p>
      </div>
    </div>
    <p class="meta" id="meta">Loading…</p>
  </header>

  <main>
    <section class="hero">
      <h1>Data Science, ML, and AI roles in one place.</h1>
      <p class="lede">For MSc/BSc Data Science profiles — remote anywhere; hybrid and on-site in the EU.</p>
    </section>

    <section class="controls" aria-label="Filters">
      <label class="search">
        <span class="sr-only">Search</span>
        <input id="q" type="search" placeholder="Search title, company, city…" autocomplete="off" />
      </label>
      <label>
        <span>Seniority</span>
        <select id="seniority">
          <option value="">All</option>
        </select>
      </label>
      <label>
        <span>Work type</span>
        <select id="jobType">
          <option value="">All</option>
        </select>
      </label>
      <label>
        <span>City / region</span>
        <select id="location">
          <option value="">All Germany</option>
        </select>
      </label>
    </section>

    <p class="count" id="count"></p>

    <section class="list" id="list" aria-live="polite"></section>
  </main>

  <footer>
    <p>Data snapshot for personal job search. Always verify on LinkedIn before applying.</p>
  </footer>

  <template id="card-tpl">
    <article class="job">
      <div class="job-top">
        <div>
          <h2 class="title"></h2>
          <p class="company"></p>
        </div>
        <div class="tags"></div>
      </div>
      <p class="where"></p>
      <p class="snippet"></p>
      <div class="actions">
        <a class="btn primary" target="_blank" rel="noopener noreferrer">View on LinkedIn</a>
        <span class="posted"></span>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
